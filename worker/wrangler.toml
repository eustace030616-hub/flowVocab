# The API on Workers. Local development needs no account: `wrangler dev --local` runs a real D1
# instance on disk, which is enough to prove the driver and the schema.
name = "flowwing-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "flowwing-api"
database_id = "48c3c18c-f1ba-4007-a4fe-f606d6485aa0"

# The page is static: Next's `output: "export"` (or this shell, for the first stage) is served by the
# assets binding, and the Worker handles only /api. Nothing about the frontend needs a server.
[assets]
directory = "../web/dist"
binding = "ASSETS"

[observability]
enabled = false

# Interim API origin: the Pi, reached through a Cloudflare quick tunnel. Ephemeral by nature — when the
# tunnel restarts, this value must be updated. Removed when the store is async (STAGE-A.md).
[vars]
PI_ORIGIN = "https://acre-makers-nissan-omissions.trycloudflare.com"
